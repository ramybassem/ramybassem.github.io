<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1150" role="img" aria-labelledby="t d">
  <title id="t">MemSynk user journey</title>
  <desc id="d">Connect a tool, pull a ledger, save a new revision, then continue in another AI.</desc>
