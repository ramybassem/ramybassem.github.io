<text x="148.0" y="979.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Stale revision</text>
<text x="148.0" y="920.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0c7c78">Stale</text>
<rect x="270.0" y="926.0" width="220.0" height="78.0" rx="12" fill="#f3fbfb" stroke="#0c7c78" stroke-width="1.8" filter="url(#shadow)"/>
<text x="380.0" y="951.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Server checks</text>
<text x="380.0" y="972.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">A rejected save stores</text>
<text x="380.0" y="986.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">nothing</text>
<rect x="502.0" y="926.0" width="220.0" height="78.0" rx="12" fill="#f3fbfb" stroke="#149e9a" stroke-width="1.6" filter="url(#shadow)"/>
<text x="612.0" y="958.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">New revision</text>
<text x="612.0" y="979.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">History and receipt</text>
<text x="612.0" y="920.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0c7c78">OK</text>
<rect x="150.0" y="1036.0" width="460.0" height="78.0" rx="12" fill="#ffffff" stroke="#08101d" stroke-width="1.6" filter="url(#shadow)"/>
<text x="380.0" y="1068.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Continue in another AI</text>
<text x="380.0" y="1089.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">It pulls the latest revision</text>
