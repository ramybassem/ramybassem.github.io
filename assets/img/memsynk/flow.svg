<text x="380.0" y="614.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Have a ledger yet?</text>
<text x="380.0" y="635.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Topic or code</text>
<rect x="502.0" y="582.0" width="220.0" height="78.0" rx="12" fill="#f3fbfb" stroke="#149e9a" stroke-width="1.6" filter="url(#shadow)"/>
<text x="612.0" y="614.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Pull the latest</text>
<text x="612.0" y="635.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Load my ledger</text>
<text x="612.0" y="576.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0c7c78">Yes</text>
<rect x="150.0" y="692.0" width="460.0" height="78.0" rx="12" fill="#ffffff" stroke="#08101d" stroke-width="1.6" filter="url(#shadow)"/>
<text x="380.0" y="724.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Work with the AI</text>
<text x="380.0" y="745.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">It uses the ledger it just loaded</text>
<rect x="150.0" y="802.0" width="460.0" height="78.0" rx="12" fill="#ffffff" stroke="#08101d" stroke-width="1.6" filter="url(#shadow)"/>
<text x="380.0" y="834.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Say save</text>
<text x="380.0" y="855.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Push against the revision it saw</text>
