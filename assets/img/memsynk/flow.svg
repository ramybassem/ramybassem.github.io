<text x="380.0" y="401.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Choose read or read-and-write, then sign in</text>
<rect x="150.0" y="458.0" width="460.0" height="78.0" rx="12" fill="#ffffff" stroke="#08101d" stroke-width="1.6" filter="url(#shadow)"/>
<text x="380.0" y="490.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#101827">Pick ledgers</text>
<text x="380.0" y="511.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="450" fill="#243044">Only the ones this AI may use</text>
